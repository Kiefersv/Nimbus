[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-exo"
version = "2.0.0"
authors = [
  { name="Sven Kiefer", email="kiefersv.mail@gmail.com" },
]
description = "Light weight microphysical cloud model for exoplanets"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "matplotlib",
    "pandas",
    "astropy",
    "netcdf4",
    "h5netcdf",
]

[project.urls]
"Homepage" = "https://nimbus-kiefersv.readthedocs.io/en/latest/"
"Download" = "https://github.com/Kiefersv/Nimbus"
